# Nginx Configuration for 3dceci.daosrl.com.ar on Contabo VM
# Location on VPS: /opt/docker/eventosips/nginx/conf.d/3dceci.conf
# Reload command on VPS: docker exec eventosips-nginx-1 nginx -s reload

upstream ceci_3d_upstream {
    server 127.0.0.1:8085;
}

server {
    listen 80;
    listen [::]:80;
    server_name 3dceci.daosrl.com.ar;

    # ACME / certbot webroot challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 3dceci.daosrl.com.ar;

    ssl_certificate     /etc/letsencrypt/live/3dceci.daosrl.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dceci.daosrl.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://ceci_3d_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
