version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  app:
    build: .
    container_name: ceci-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - app-network
    volumes:
      - ./data:/app/data

  web:
    image: nginx:alpine-slim
    container_name: ceci-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    networks:
      - app-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
